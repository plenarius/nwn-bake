name: Release

# On a version tag (v0.2.0): builds nwn-bake for Linux (x86-64, in a Debian 12 container, so it runs on glibc 2.36 and newer),
# Windows (x86-64) and macOS (one universal binary for Apple silicon and Intel, signed with a Developer ID and notarized), runs
# each on the made-up fixture, and publishes a GitHub release with an archive per platform (the binary, LICENSE, README.md,
# MOONGLOW.md and the third-party licences), SHA256SUMS and the complete source with every dependency vendored, as the GPL asks.
# Run by hand, it builds and tests the binaries (the macOS one signed ad hoc) and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends cmake clang libclang-dev pkg-config git ca-certificates >/dev/null
      - name: Build
        env:
          NWN_BAKE_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked -p nwn-bake-cli
      - name: Smoke test on the fixture
        run: scripts/smoke-test.sh "$PWD/target/release/nwn-bake"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-linux-x86_64
          path: target/release/nwn-bake

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build
        env:
          NWN_BAKE_COMMIT: ${{ github.sha }}
        run: cargo build --release --locked -p nwn-bake-cli
      - name: Smoke test on the fixture
        shell: bash
        run: scripts/smoke-test.sh "$PWD/target/release/nwn-bake.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-windows-x86_64
          path: target/release/nwn-bake.exe

  macos:
    runs-on: macos-latest
    # Apple's first notarizations for an account can take a while; the notary wait has its own 1 h limit.
    timeout-minutes: 150
    # The signing secrets live in an environment that only v* tags may use; a manual run gets none and signs ad hoc.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    env:
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (stable, both targets)
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
      - name: Build
        env:
          NWN_BAKE_COMMIT: ${{ github.sha }}
        run: |
          cargo build --release --locked -p nwn-bake-cli --target aarch64-apple-darwin
          cargo build --release --locked -p nwn-bake-cli --target x86_64-apple-darwin
          mkdir -p universal
          lipo -create -output universal/nwn-bake target/aarch64-apple-darwin/release/nwn-bake target/x86_64-apple-darwin/release/nwn-bake
          lipo -info universal/nwn-bake
      - name: Signing keychain
        if: env.SIGN == 'true'
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Lets codesign use the key without a UI prompt, which would hang the runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Sign
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -eu
          if [ "$SIGN" = true ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            identity=$(security find-identity -v -p codesigning "$keychain" |
              grep "Developer ID Application: .*($TEAM_ID)" | head -n1 | awk '{print $2}')
            [ -n "$identity" ] || { echo "no Developer ID Application identity for team $TEAM_ID" >&2; exit 1; }
            # Hardened runtime and a secure timestamp are what notarization requires.
            codesign --force --options runtime --timestamp --keychain "$keychain" --sign "$identity" universal/nwn-bake
          else
            codesign --force --sign - universal/nwn-bake
          fi
          codesign --verify --strict --verbose=2 universal/nwn-bake
          codesign --display --verbose=2 universal/nwn-bake
      # Run on the signed binary, so a hardened-runtime problem fails here and not on a user's machine.
      - name: Smoke test on the fixture
        run: scripts/smoke-test.sh "$PWD/universal/nwn-bake"
      - name: Notarize
        if: env.SIGN == 'true'
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -eu
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$NOTARY_KEY" > "$key"
          ditto -c -k --keepParent universal/nwn-bake "$RUNNER_TEMP/nwn-bake-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/nwn-bake-notarize.zip" --key "$key" --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" --wait --timeout 1h --output-format json | tee "$RUNNER_TEMP/notary.json"
          status=$(jq -r .status "$RUNNER_TEMP/notary.json")
          if [ "$status" != Accepted ]; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary.json")" --key "$key" --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" || true
            echo "notarization: $status" >&2
            exit 1
          fi
          # A bare binary cannot be stapled; Gatekeeper looks the ticket up online on first run.
      - name: Remove signing keychain and keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/nwn-bake-notarize.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-macos-universal
          path: universal/nwn-bake

  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Third-party licences
        run: |
          cargo install --locked cargo-about --version 0.9.3 --features cli
          # --fail: a crate whose licence cannot be shipped, or a clarification whose files changed (about.toml), stops the release.
          cargo about generate --workspace --all-features --fail --locked -o THIRD-PARTY-LICENSES.html about.hbs
      - name: Source with every dependency
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          name=nwn-bake-$version-source
          mkdir -p "dist/$name/.cargo"
          git archive HEAD | tar -x -C "dist/$name"
          cp THIRD-PARTY-LICENSES.html "dist/$name/"
          (cd "dist/$name" && cargo vendor --locked vendor > .cargo/config.toml)
          tar -C dist -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: |
            nwn-bake-*-source.tar.gz
            THIRD-PARTY-LICENSES.html

  publish:
    needs: [linux, windows, macos, source]
    # Only a version tag makes a release. A manual run (workflow_dispatch) builds and tests the binaries and stops here.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Archives and SHA256SUMS
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          mkdir dist
          docs="LICENSE README.md MOONGLOW.md CHANGELOG.md artifacts/source/THIRD-PARTY-LICENSES.html"
          pack() { # <platform> <binary> <zip|tar>
            dir="nwn-bake-$version-$1"
            mkdir "$dir"
            cp "$2" "$dir/"
            chmod +x "$dir/$(basename "$2")"
            cp $docs "$dir/"
            if [ "$3" = zip ]; then zip -qr "dist/$dir.zip" "$dir"; else tar -czf "dist/$dir.tar.gz" "$dir"; fi
          }
          pack linux-x86_64 artifacts/bin-linux-x86_64/nwn-bake tar
          pack windows-x86_64 artifacts/bin-windows-x86_64/nwn-bake.exe zip
          pack macos-universal artifacts/bin-macos-universal/nwn-bake tar
          cp artifacts/source/nwn-bake-*-source.tar.gz dist/
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          files: dist/*
          body: |
            The source is GPL-3.0-or-later. These binaries include Moonglow (GPL-3.0-only), so they are under GPL-3.0. The complete
            source of the binaries, every dependency included, is `nwn-bake-*-source.tar.gz`. See CHANGELOG.md for what changed.
            Needs a legally obtained Neverwinter Nights: Enhanced Edition install; ships none of its content.
