# cargo-deny: licences, security advisories, duplicate crates and where crates come from. Shared by every Rust workspace that
# follows STYLE.md.

[graph]
all-features = true

[advisories]
# RustSec advisories: a vulnerable or unmaintained crate fails the check. Ignore one only with a reason and a date to look again.
# `zip` 8.6.0 comes in through Moonglow (`mg-module`), which asks for `zip = "8"`. 8.6.0 is the last 8.x and the fixes are in 9.0.0
# only, so cargo cannot update it until Moonglow moves to zip 9 and our pin follows (MOONGLOW.md). All four are in
# `ZipArchive::extract` and `ZipStreamReader::extract`, which no workspace that follows STYLE.md calls: Moonglow reads entries with
# `by_name`, and our own code only writes zips, or has no zip code. Look again on 2027-02-01, or when the Moonglow pin moves.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 through Moonglow's zip 8 pin; only extract() is affected, which nothing here calls" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 through Moonglow's zip 8 pin; only extract() is affected, which nothing here calls" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 through Moonglow's zip 8 pin; only extract() is affected, which nothing here calls" },
    { id = "RUSTSEC-2026-0429", reason = "zip 8.6.0 through Moonglow's zip 8 pin; only extract() is affected, which nothing here calls" },
]

[licenses]
# The same list as `about.toml` (cargo-about, the release's third-party licences), plus our own.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The list is shared, so one workspace may not use every licence on it.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are not on crates.io.
ignore = true

[bans]
# Two versions of one crate: reported, not failed (the graphics and image crates pull in several).
multiple-versions = "warn"
# `*` versions are banned; path dependencies inside the workspace are fine.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Moonglow comes from git, pinned to one commit (MOONGLOW.md). Programs built on nwn-bake take it from git too, at a release tag.
allow-git = ["https://github.com/jadzziaa/moonglow-toolset", "https://github.com/plenarius/nwn-bake"]
