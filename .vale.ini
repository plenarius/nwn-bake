# Vale: the plain-language rules of STYLE.md ("Writing"). Shared by every repository that follows it.
#
# Levels: error = a rule STYLE.md states (filler words, wordy phrases, em dashes, our terms); the check fails on these.
# suggestion = worth a look, not always wrong (vague amounts, passive voice, long sentences); `vale --minAlertLevel=suggestion`
# shows them.
StylesPath = .vale/styles
MinAlertLevel = warning


[*.md]
BasedOnStyles = Plain

[*.{rs,js}]
BasedOnStyles = Plain
# In code, sentence length and the passive voice are left to the reader.
Plain.SentenceLength = NO
Plain.Passive = NO
